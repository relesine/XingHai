# ============================================================
# 星海视频社交平台 · Nginx 生产反向代理示例
#
# 用法：
#   1) 将三端构建产物放到独立目录，例如：
#        /var/www/xinghai/user      <- web-user/dist
#        /var/www/xinghai/creator   <- web-creator/dist
#        /var/www/xinghai/admin     <- web-admin/dist
#   2) 将本文件放到 /etc/nginx/conf.d/xinghai.conf
#   3) 把 server_name 改成实际域名，执行 nginx -t && nginx -s reload
#
# 说明：三端均使用 Hash 路由（/#/xxx），静态托管即可，无需 history 回退前缀。
# ============================================================

upstream xinghai_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------------- 用户端 ----------------
server {
    listen 80;
    server_name user.xinghai.example;

    root /var/www/xinghai/user;
    index index.html;

    client_max_body_size 600m;
    charset utf-8;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 带哈希的静态资源长缓存
    location /assets/ {
        expires 30d;
    }

    # 入口页不缓存，保证发版后立即生效
    location = /index.html {
        expires -1;
    }

    location /api/ {
        proxy_pass http://xinghai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /upload/ {
        proxy_pass http://xinghai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}

